<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Done Right — tests</title>
  <style>
    body { font: 14px/1.45 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    #summary { margin: 8px 0 16px; font-weight: 700; }
    .suite { margin: 14px 0 4px; font-weight: 700; color: #ffb199; }
    .t { padding: 2px 0 2px 14px; }
    .pass::before { content: '✓ '; color: #4cb782; }
    .fail::before { content: '✗ '; color: #ff6b5b; }
    .err { color: #ff9b8f; padding-left: 30px; white-space: pre-wrap; font-size: 12px; }
    .ms { color: #888; font-size: 11px; }
    #app { display: none; }
  </style>
  <script>
    // isolated storage so tests never touch real app data
    window.DR_STORAGE_KEY = 'doneright.test.v1';
    window.DR_FILES_DB = 'doneright-files-test';
    try { localStorage.removeItem('doneright.test.v1'); sessionStorage.clear(); } catch (e) {}
  </script>
</head>
<body>
  <h1>Done Right — test suite</h1>
  <div id="summary">Running…</div>
  <div id="out"></div>
  <div id="app"></div>
  <script>
    // load sources sequentially with cache-busting so tests always run the latest code
    (async function () {
      const files = ["../js/core.js", "../js/i18n.js", "../js/i18n/dict.js", "../js/i18n/ui.js", "../js/i18n/ui2.js", "../js/i18n/data.js", "../js/config.js", "../js/data/categories.js", "../js/data/locations.js", "../js/data/licensing.js", "../js/data/providers.js", "../js/booking.js", "../js/rt.js", "../js/links.js", "../js/seo.js", "../js/demo.js", "../js/backend.js", "../tools/catalog-sql.js", "../js/pages/home.js", "../js/pages/browse.js", "../js/pages/provider.js", "../js/pages/orders.js", "../js/pages/quotes.js", "../js/pages/account.js", "../js/pages/verify.js", "../js/pages/admin.js", "../js/pages/pro.js", "harness.js", "helpers.js", "perf.test.js", "core.test.js", "availability.test.js", "booking.test.js", "quotes.test.js", "licensing.test.js", "verification.test.js", "chat.test.js", "search-seo.test.js", "backend.test.js", "lists.test.js", "links.test.js", "launch.test.js", "i18n.test.js"];
      const v = Date.now();
      for (const f of files) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = f + '?t=' + v; s.onload = res; s.onerror = () => rej(new Error('failed to load ' + f)); document.body.appendChild(s); });
      T.run();
    })();
  </script>
</body>
</html>
